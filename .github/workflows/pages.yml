name: Publish the site

# Only the contents of site/ are published: the landing page, the unlock script, and the
# sealed packs. Nothing is built or decrypted here, and no key ever reaches this runner —
# sealing happens locally, on the machine that holds the source.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refuse-plaintext:
    # A build that publishes a readable client file is worse than a failed build, so the
    # workflow looks for one before Pages ever sees the directory.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refuse to publish anything readable from a pack
        # The same check the local verification runs, so a build cannot pass there and fail
        # here, or the reverse. It tests what actually matters — that no published file is a
        # readable file of a known kind — rather than searching for short markers, which
        # ciphertext produces by chance often enough to make a gate useless.
        run: node tools/refuse-plaintext.mjs site/enc

  deploy:
    needs: refuse-plaintext
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble what gets served
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r site/public/. _site/
          if [ -d site/enc ]; then mkdir -p _site/enc && cp -r site/enc/. _site/enc/; fi
          # Stamp the commit onto the viewer's own assets. Pages serves them with ten minutes
          # of cache, so without this a reader who visited before a fix keeps the broken
          # version for ten minutes after every deploy, and so does anyone testing it — which
          # cost real time chasing a caption bug that was already fixed.
          # Extended regex and a delimiter that is not also the alternation character: with "|"
          # doing both jobs, sed read "\|" as an escaped delimiter and quietly changed nothing.
          for f in _site/*.html; do
            sed -Ei "s#(src|href)=\"(unlock\.js|style\.css)\"#\1=\"\2?v=${GITHUB_SHA:0:12}\"#g" "$f"
          done
          grep -ho 'unlock\.js?v=[0-9a-f]*' _site/*.html | sort -u || echo 'no script reference was stamped'
          # Jekyll would otherwise ignore anything beginning with an underscore.
          touch _site/.nojekyll
          find _site -maxdepth 2 -type d | sed 's|^|  |'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
